name: Deploy

# Kumru (turk.shab.boo): the gates on every push and pull request; on `main`, with the real data, the D1 migrations
# and the deploy (docs/SPECS.md section 11.5). Sahne comes in as the `sahne/` submodule.
# The book-derived data (cards, cards-extra, grammar, path, syllabus) is private: when the KUMRU_DATA_TOKEN secret
# exists, only kumru-data/ of the private course repo is checked out (sparse) and scripts/data.mjs links it into data/.
# Without it (a fork's pull request) every step runs on data-sample/, smoke and the deploy are skipped, and the
# story check skips its course rules. A manual run redeploys main after a data change in the course repo.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read   # gitleaks-action lists a pull request's commits

jobs:
  kumru:
    runs-on: ubuntu-latest
    env:
      HAS_DATA: ${{ secrets.KUMRU_DATA_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0   # gitleaks scans the history

      # before the private data is anywhere on disk: nothing private is tracked, and no secret is in the history
      - name: scan for private data
        run: |
          bad=$(git ls-files | grep -E '^data/(cards|cards-extra|grammar|path|syllabus)(/|$)|(^|/)yk-s-[^/]*$|(^|/)content/' || true)
          if [ -n "$bad" ]; then echo "private or book-derived files are tracked:"; echo "$bad"; exit 1; fi
          echo "no private data tracked"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: private data (course repo, kumru-data/ only)
        if: env.HAS_DATA == 'true'
        uses: actions/checkout@v4
        with:
          repository: mehrad77/yakerim
          token: ${{ secrets.KUMRU_DATA_TOKEN }}
          path: .kumru-private
          sparse-checkout: kumru-data
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - if: env.HAS_DATA == 'true'
        run: echo "KUMRU_DATA=$GITHUB_WORKSPACE/.kumru-private/kumru-data" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4   # version from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v5

      - run: pnpm install --frozen-lockfile
      - run: cp .dev.vars.example .dev.vars

      - name: check
        run: pnpm check
      - name: test
        run: pnpm test
      - name: smoke (real data only: it uses real ids such as sk_hello and ge_method)
        if: env.HAS_DATA == 'true'
        run: pnpm exec playwright install --with-deps chromium && pnpm smoke

      - name: deploy
        if: env.HAS_DATA == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
